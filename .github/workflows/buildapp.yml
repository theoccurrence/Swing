# Original idea by @ISnackable. Thanks to him for handling the hardest parts!
# https://github.com/ISnackable/YTCubePlus/blob/main/.github/workflows/Build.yml
#
# Builds a SideStore/AltStore-compatible IPA for one app set: it downloads the
# decrypted IPA, injects the selected tweaks of that app set and packs the
# result.
#
# The workflow knows no concrete app. The tweak registry, the payload versions,
# the display name, the bundle id, the alternate icons and the Safari extensions
# all come from apps/<app_id>/, so supporting another app means adding a
# directory - and inspecting an IPA once, so apps/<app_id>/app.json records which
# app it is (see inspect-ipa.yml).

name: Build and Release AppBuilder

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "App set to build (a directory under apps/)"
        default: "youtube"
        required: true
        type: string
      decrypted_ipa_url:
        description: "Direct URL of the decrypted IPA"
        default: ""
        required: true
        type: string
      app_name:
        description: "Display name of the produced app (default: apps/<app_id>/app.json)"
        default: ""
        required: false
        type: string
      bundle_id:
        description: "Bundle ID of the produced app (default: apps/<app_id>/app.json)"
        default: ""
        required: false
        type: string
      ipa_prefix:
        description: "Prefix of the produced IPA file name"
        default: "App"
        required: false
        type: string
      sdk_version:
        # 27.x selects the xcode-27 image below; jobs that ask for macos-latest
        # never get a runner here and are cancelled by GitHub after ~15 minutes.
        description: "iOS SDK Version (27.x runs on the xcode-27 image)"
        default: "27.2"
        required: true
        type: string
      commit_id:
        description: "(Optional) Commit ID to build at"
        default: ""
        required: false
        type: string
      upload_artifact:
        description: "Upload IPA as artifact"
        default: false
        required: false
        type: boolean
      create_release:
        description: "Create a draft release"
        default: true
        required: false
        type: boolean
      enabled_tweaks:
        description: "Tweaks to include (space/comma ids); empty = the app default, 'none' = none"
        default: ""
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AppBuilder
    # The iOS 27 SDK can only be consumed by the Xcode 27 toolchain: its .tbd
    # stubs list the arm64e.x1 target (unknown to Xcode 26's linker) and its
    # headers use attributes such as stack_protector_ignore (unknown to Xcode
    # 26's clang). The macos-latest images stop at Xcode 26, so iOS 27+ needs
    # the xcode-27 (preview) image. Everything older builds on macos-latest.
    runs-on: ${{ fromJSON(inputs.sdk_version) >= 27 && 'xcode-27' || 'macos-latest' }}
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v7
        with:
          path: main
          ref: ${{ inputs.commit_id || github.ref }}
          submodules: recursive

      # A build is only possible for an IPA that the Inspect IPA workflow has
      # already accepted: apps/<app_id>/app.json records the SHA-256 of the URL,
      # and a URL that does not hash to it is refused here. The URL itself is a
      # secret and is never stored - only its hash.
      - name: Verify the IPA was inspected
        working-directory: main
        env:
          IPA_URL: ${{ inputs.decrypted_ipa_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$IPA_URL"
          [ -n "$IPA_URL" ] || { echo "error: decrypted_ipa_url is empty" >&2; exit 1; }
          app="${{ inputs.app_id }}"
          manifest="apps/$app/app.json"
          [ -f "$manifest" ] || {
            echo "error: $manifest does not exist - unknown app '$app'" >&2
            exit 1
          }
          expected="$(python3 Tools/app-info.py --app "$app" --field source)"
          actual="sha256:$(printf '%s' "$IPA_URL" | shasum -a 256 | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "error: this IPA URL has not been inspected for '$app'." >&2
            echo "error: apps/$app/app.json records ${expected:-no source at all}." >&2
            echo "error: run the 'Inspect IPA' workflow for this URL first - a build is only possible for a verified IPA." >&2
            exit 1
          fi
          echo "IPA verified against $manifest." >> "$GITHUB_STEP_SUMMARY"

      - name: Install Dependencies
        run: |
          brew install ldid dpkg make wget unzip jq pipx meson ninja gnu-sed autoconf automake libtool pkgconf pngquant

      - name: Set PATH
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: actions/checkout@v7
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: SDK Caching
        id: SDK
        uses: actions/cache@v6
        with:
          path: theos/sdks/
          # The source is part of the key: caches from the previous SDK repo
          # (aricloverALT/sdks) must not be reused.
          key: iOS-xybp888-${{ inputs.sdk_version }}-SDK

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs.git sdks
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS${{ inputs.sdk_version }}.sdk
          git checkout --quiet
          if [ ! -d "iPhoneOS${{ inputs.sdk_version }}.sdk" ]; then
            echo "error: iPhoneOS${{ inputs.sdk_version }}.sdk does not exist in xybp888/iOS-SDKs" >&2
            exit 1
          fi
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Setup Theos Jailed
        uses: actions/checkout@v7
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed

      - name: Install Theos Jailed
        run: ./theos-jailed/install
        env:
          THEOS: ${{ github.workspace }}/theos

      # ipa.sh builds inject_files=("$DYLIB" $INJECT_DYLIBS). The Makefile exports
      # DYLIB empty - the root target has no sources and is never injected - and
      # an empty source arg makes rsync copy the whole build directory (rsync
      # before 3.2.3 reads "" as ".") into the app's Frameworks/ - that is what
      # produced the ~700 MB IPA and the ~1.4 GB installed app. Relax the quoting
      # so an empty value contributes no array entry at all.
      #
      # ./theos-jailed/install copies the module into $THEOS, so the script the
      # build reads is the installed one; patching the clone is a no-op.
      - name: Patch theos-jailed injection list
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          FILE="$THEOS/mod/jailed/bin/ipa.sh"
          sed -i '' 's/inject_files=("\$DYLIB" \$INJECT_DYLIBS)/inject_files=($DYLIB $INJECT_DYLIBS)/' "$FILE"
          grep -n 'inject_files=' "$FILE"
          # The patch above is only as good as the line it matches: if upstream
          # rewords it, an empty $DYLIB must still not end up as a quoted (or
          # empty) array element, so refuse to build instead of shipping a
          # several-hundred-MB IPA again.
          if grep -Eq 'inject_files=\([^)]*"[^)]*DYLIB' "$FILE"; then
            echo "error: $FILE still quotes a DYLIB in inject_files - did theos-jailed change?" >&2
            exit 1
          fi

      - name: Fix Theos broken pipe issue
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          find $THEOS -name "*.sh" -type f | while read -r SCRIPT; do
            if grep -q '| head' "$SCRIPT" 2>/dev/null; then
              sed -i '' 's/| head/2>\/dev\/null | head/g' "$SCRIPT" 2>/dev/null || true
              echo "Patched: $SCRIPT"
            fi
          done
          find $THEOS -name "*.mk" -type f | while read -r MK; do
            if grep -q '| head' "$MK" 2>/dev/null; then
              sed -i '' 's/| head/2>\/dev\/null | head/g' "$MK" 2>/dev/null || true
              echo "Patched: $MK"
            fi
          done
          echo "Broken pipe fixes applied"

      - name: Install cyan and tbd
        run: |
          pipx install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          wget --quiet "https://github.com/inoahdev/tbd/releases/download/2.2/tbd-mac" -O /usr/local/bin/tbd
          chmod +x /usr/local/bin/tbd

      # Everything the later steps need about the app comes out of
      # apps/<app_id>/app.json, so no step below names a concrete app.
      - name: Resolve the app
        id: app
        working-directory: main
        run: |
          set -euo pipefail
          app="${{ inputs.app_id }}"
          [ -d "apps/$app" ] || { echo "error: apps/$app does not exist" >&2; exit 1; }
          name="${{ inputs.app_name }}"
          [ -n "$name" ] || name="$(python3 Tools/app-info.py --app "$app" --field name --default "$app")"
          bundle="${{ inputs.bundle_id }}"
          [ -n "$bundle" ] || bundle="$(python3 Tools/app-info.py --app "$app" --field bundleIds.0 --default "")"
          [ -n "$bundle" ] || { echo "error: no bundle id for '$app' - inspect an IPA or pass bundle_id" >&2; exit 1; }
          {
            echo "app_name=$name"
            echo "bundle_id=$bundle"
          } >> "$GITHUB_OUTPUT"
          echo "app=$app, name=$name, bundle=$bundle"

      - name: Mask the IPA URL and prepare the IPA
        id: prepare
        working-directory: main
        env:
          IPA_URL: ${{ inputs.decrypted_ipa_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$IPA_URL"
          curl -fsSL "$IPA_URL" -o "$RUNNER_TEMP/App.ipa"
          unzip -q "$RUNNER_TEMP/App.ipa" -d .
          app_path="$(ls -d Payload/*.app | head -n1)"
          [ -n "$app_path" ] || { echo "error: the IPA has no Payload/*.app bundle" >&2; exit 1; }
          app_bin="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")"
          outname="${{ inputs.ipa_prefix || 'App' }}_${app_version}.ipa"
          echo "app bundle: $app_path, executable: $app_bin, version: $app_version"
          {
            echo "app_path=$app_path"
            echo "app_bin=$app_bin"
            echo "app_version=$app_version"
          } >> "$GITHUB_OUTPUT"
          {
            echo "APP_VERSION=$app_version"
            echo "OUTNAME=$outname"
            echo "IPA_PREFIX=${{ inputs.ipa_prefix || 'App' }}"
          } >> "$GITHUB_ENV"

      # Fails in seconds when the tweak selection cannot fit into the app
      # binary's load-command area. Without it insert_dylib stalls for hours
      # instead of failing. The dylib list comes from the Makefile
      # (`make print-inject-dylibs`), so there is no second registry to keep in
      # sync: a tweak added through apps/<app>/custom.mk is covered automatically.
      - name: Check injection budget
        working-directory: main
        env:
          THEOS: ${{ github.workspace }}/theos
          INPUT_TWEAKS: ${{ inputs.enabled_tweaks }}
        run: |
          set -euo pipefail
          tweaks="$(printf '%s' "$INPUT_TWEAKS" | tr -s ', ' ' ' | sed 's/^ *//;s/ *$//')"
          if [ "$tweaks" = "none" ]; then
            enabled_arg="ENABLED_TWEAKS="
          elif [ -n "$tweaks" ]; then
            enabled_arg="ENABLED_TWEAKS=$tweaks"
          else
            enabled_arg=""
          fi
          echo "ENABLED_ARG=$enabled_arg" >> "$GITHUB_ENV"
          dlibs="$(make -s --no-print-directory \
            APP="${{ inputs.app_id }}" \
            SDK_VERSION="${{ inputs.sdk_version }}" \
            $enabled_arg \
            print-inject-dylibs)"
          echo "injected dylibs:"
          printf '  %s\n' $dlibs
          python3 Tools/check-inject-budget.py \
            --binary "${{ steps.prepare.outputs.app_path }}/${{ steps.prepare.outputs.app_bin }}" \
            --dylibs "$dlibs"

      - name: Build Package
        id: build_package
        working-directory: main
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail
          make package THEOS_PACKAGE_SCHEME=rootless \
            IPA="${{ steps.prepare.outputs.app_path }}" FINALPACKAGE=1 \
            APP="${{ inputs.app_id }}" \
            SDK_VERSION="${{ inputs.sdk_version }}" \
            BUNDLE_ID="${{ steps.app.outputs.bundle_id }}" \
            DISPLAY_NAME="${{ steps.app.outputs.app_name }}" \
            IPA_PREFIX="${{ inputs.ipa_prefix || 'App' }}" \
            $ENABLED_ARG
          echo "package=$(ls -t packages | head -n1)" >> $GITHUB_OUTPUT

      # The Safari extensions an app set injects are declared in its manifest, so
      # an app without any (Instagram) simply skips this.
      - name: Clone Safari extensions
        working-directory: main
        env:
          APP_ID: ${{ inputs.app_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/appex"
          python3 - <<'PY' > "$RUNNER_TEMP/extensions.tsv"
          import json, os
          data = json.load(open(f"apps/{os.environ['APP_ID']}/app.json"))
          for ext in (data.get("build") or {}).get("safariExtensions") or []:
              print(f"{ext['repo']}\t{ext['appex']}")
          PY
          while IFS=$'\t' read -r repo appex; do
            [ -n "$repo" ] || continue
            dir="$RUNNER_TEMP/extclone/$(basename "$repo")"
            rm -rf "$dir"
            git clone --quiet -n --depth=1 --filter=tree:0 "https://github.com/$repo.git" "$dir"
            ( cd "$dir" && git sparse-checkout set --no-cone "$appex" && git checkout --quiet )
            cp -R "$dir/$appex" "$RUNNER_TEMP/appex/$appex"
            echo "cloned $repo -> $appex"
          done < "$RUNNER_TEMP/extensions.tsv"
          ls -la "$RUNNER_TEMP/appex"

      - name: Inject Tweaks Into IPA
        working-directory: main
        run: |
          set -euo pipefail
          ipa_in="packages/${{ steps.build_package.outputs.package }}"
          appex_args=()
          for d in "$RUNNER_TEMP/appex"/*.appex; do
            [ -e "$d" ] && appex_args+=(-uwef "$d")
          done
          # Only the cloned Safari extensions are injected here: the theos-jailed
          # build already put every compiled tweak into the app, so handing it the
          # .deb as well would just copy those files a second time.
          cyan -i "$ipa_in" -o "$OUTNAME" ${appex_args[@]+"${appex_args[@]}"} \
            -n "${{ steps.app.outputs.app_name }}" -b "${{ steps.app.outputs.bundle_id }}"

      - name: Strip Unresignable Extensions From Final IPA
        id: strip_ipa
        working-directory: main
        run: |
          set -euo pipefail
          if [ ! -f "$OUTNAME" ]; then
            OUTNAME="$(basename "$(find . -maxdepth 3 -name "${IPA_PREFIX}_*.ipa" -print -quit)")"
          fi
          echo "Final IPA: $OUTNAME"

          echo "--- .appex bundles contained in final IPA ---"
          unzip -Z1 "$OUTNAME" | grep '\.appex/' | sed 's|^\(.*\.appex\)/.*|\1|' | sort -u | tee appex_list.txt || true

          BAD="$(grep -v '/PlugIns/' appex_list.txt || true)"
          if [ -n "$BAD" ]; then
            echo "Removing unresignable extensions:"
            printf '%s\n' "$BAD"
            printf '%s\n' "$BAD" | while IFS= read -r d; do
              zip -q -d "$OUTNAME" "${d}/*" || true
            done
          else
            echo "All extensions are under PlugIns/ - OK for SideStore."
          fi
          SC_INFO_MATCHES="$(unzip -Z1 "$OUTNAME" | grep '/SC_Info/' || true)"
          if [ -n "$SC_INFO_MATCHES" ]; then
            echo "Removing files under SC_Info/ - OK for AltStore.:"
            printf '%s\n' "$SC_INFO_MATCHES"
            zip -q -d "$OUTNAME" "Payload/*/SC_Info/*" "Payload/*/SC_Info" || true
          fi
          mkdir -p packages
          cp -f "$OUTNAME" "packages/$OUTNAME"
          find packages -maxdepth 1 -name "*.ipa" ! -name "$OUTNAME" -delete || true
          echo "Final SideStore-compatible IPA: packages/$OUTNAME"
          echo "final_ipa=$OUTNAME" >> "$GITHUB_OUTPUT"

      # Alternate icons only exist for app sets that ship them (build.alternateIcons
      # in apps/<app>/app.json, images in apps/<app>/icons). Apps without them skip
      # straight to the upload.
      - name: Register Alternate App Icons
        working-directory: main
        env:
          APP_ID: ${{ inputs.app_id }}
        run: |
          set -euo pipefail
          app="$APP_ID"
          want="$(python3 Tools/app-info.py --app "$app" --field build.alternateIcons --default false)"
          if [ "$want" != "true" ] || [ ! -d "apps/$app/icons" ]; then
            echo "No alternate icons for '$app' - skipping." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ipa="packages/${{ steps.strip_ipa.outputs.final_ipa }}"
          app_path="${{ steps.prepare.outputs.app_path }}"
          rm -rf iconwork && mkdir -p iconwork/icons && cd iconwork
          unzip -q "../$ipa" "$app_path/Info.plist"
          PLIST="$app_path/Info.plist"
          RAW_ICON_SRC="../apps/$app/icons"
          ICON_SRC="icons"
          for f in "$RAW_ICON_SRC"/*.png; do
            name="$(basename "$f")"
            pngquant --quality=80-95 --strip --skip-if-larger "$f" --output "$ICON_SRC/$name" >/dev/null 2>&1 || true
            [ -f "$ICON_SRC/$name" ] || cp -f "$f" "$ICON_SRC/$name"
          done
          PB=/usr/libexec/PlistBuddy
          BADICONS=0
          for f in "$ICON_SRC"/*.png; do
            SPEC="$(sips -g pixelWidth -g pixelHeight -g hasAlpha "$f" 2>/dev/null | awk '/pixelWidth/{w=$2} /pixelHeight/{h=$2} /hasAlpha/{a=$2} END{print w"x"h" alpha="a}')"
            case "$SPEC" in
              "1024x1024 alpha=no"*) ;;
              *) echo "::warning::$(basename "$f") is $SPEC"; BADICONS=1 ;;
            esac
          done
          if [ "$BADICONS" != 0 ]; then
            echo "::error::app icons must be 1024x1024 opaque PNGs or iOS rejects them with OSStatus -54"
            exit 1
          fi
          # Create intermediate dicts FIRST (PlistBuddy cannot nest-create).
          for ROOT in CFBundleIcons "CFBundleIcons~ipad"; do
            $PB -c "Add :$ROOT dict" "$PLIST" 2>/dev/null || true
            $PB -c "Add :$ROOT:CFBundleAlternateIcons dict" "$PLIST" 2>/dev/null || true
          done
          for f in "$ICON_SRC"/*.png; do
            NAME="$(basename "$f" .png)"
            cp -f "$f" "$app_path/$NAME.png"
            for ROOT in CFBundleIcons "CFBundleIcons~ipad"; do
              $PB -c "Add :$ROOT:CFBundleAlternateIcons:$NAME dict" "$PLIST" 2>/dev/null || true
              $PB -c "Add :$ROOT:CFBundleAlternateIcons:$NAME:CFBundleIconFiles array" "$PLIST" 2>/dev/null || true
              $PB -c "Add :$ROOT:CFBundleAlternateIcons:$NAME:CFBundleIconFiles:0 string $NAME" "$PLIST" 2>/dev/null || true
            done
            echo "Registered alternate icon: $NAME"
          done
          $PB -c "Print :CFBundleIcons:CFBundleAlternateIcons" "$PLIST" | head -20
          zip -q "../$ipa" "$PLIST" "$app_path"/*.png
          cd .. && rm -rf iconwork
          echo "Alternate icons registered into $(basename "$ipa")"

      - name: Upload Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v7
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_VERSION: ${{ steps.prepare.outputs.app_version }}
        with:
          name: ${{ inputs.ipa_prefix || 'App' }}_${{ env.APP_ID }}_${{ env.APP_VERSION }}
          path: ${{ github.workspace }}/main/packages/${{ steps.strip_ipa.outputs.final_ipa }}
          if-no-files-found: error

      - name: Create Release
        if: ${{ inputs.create_release }}
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_ID: ${{ inputs.app_id }}
          APP_VERSION: ${{ steps.prepare.outputs.app_version }}
        with:
          tag_name: v${{ env.APP_ID }}-${{ env.APP_VERSION }}-(${{ github.run_number }})
          name: v${{ env.APP_ID }}-${{ env.APP_VERSION }}-(${{ github.run_number }})
          files: main/packages/*.ipa
          draft: true
