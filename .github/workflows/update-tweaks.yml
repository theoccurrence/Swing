# Bumps the tweaks that lag behind their upstream repositories.
#
# Tools/check-tweak-updates.py compares every tweak of every app set in apps/
# with its upstream (pinned commit + control version for submodules, the release
# of the payload .deb for Gonerino and YTPlus, nothing for vendored tweaks).
# Submodule tweaks move to the head of the branch .gitmodules names - or of the
# repository's default branch - and payload versions are bumped in that app's
# payloads.mk. The shared header/library submodules an app lists in
# APP_SUPPORT_SUBMODULES travel with any tweak bump, because tweaks commonly
# need their newer headers to compile. Nothing is committed unless the bumped
# tweaks still compile.

name: Update tweaks

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Only this app set (empty = every app)"
        default: ""
        required: false
        type: string
      only:
        description: "Tweaks to update (space/comma ids; empty = every outdated tweak)"
        default: ""
        required: false
        type: string
      include_payload:
        description: "Also bump payload tweaks (YTPlus, Gonerino)"
        default: true
        required: false
        type: boolean
      include_support:
        description: "Move the shared header/library submodules the tweaks build against"
        default: true
        required: false
        type: boolean
      verify:
        description: "Compile the bumped tweaks before pushing"
        default: true
        required: false
        type: boolean
      push:
        description: "Commit and push the bumps (off = only show what would change)"
        default: true
        required: false
        type: boolean
      sdk_version:
        description: "iOS SDK version used to verify the compile"
        default: "27.2"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Update tweaks
    # macos-latest has no runner in this repository - a job that asks for it sits
    # in the queue until GitHub cancels it - so the update runs on the image the
    # build workflow uses.
    runs-on: xcode-27
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: repo
          ref: ${{ github.ref }}
          # The submodule bumps are regular commits on top of the current tip.
          fetch-depth: 0
          submodules: recursive

      - name: Check tweak versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_APP: ${{ inputs.app }}
        run: |
          cd repo
          if [ -n "$INPUT_APP" ]; then
            python3 Tools/check-tweak-updates.py --app "$INPUT_APP"
            python3 Tools/check-tweak-updates.py --app "$INPUT_APP" --json > "$RUNNER_TEMP/updates.json"
          else
            python3 Tools/check-tweak-updates.py
            python3 Tools/check-tweak-updates.py --json > "$RUNNER_TEMP/updates.json"
          fi

      - name: Plan the update
        id: plan
        env:
          INPUT_ONLY: ${{ inputs.only }}
          INPUT_INCLUDE_PAYLOAD: ${{ inputs.include_payload }}
          INPUT_INCLUDE_SUPPORT: ${{ inputs.include_support }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          report = json.loads((runner_temp / "updates.json").read_text())
          only = {i for i in re.split(r"[\s,]+", os.environ["INPUT_ONLY"].strip()) if i}
          include_payload = os.environ["INPUT_INCLUDE_PAYLOAD"] == "true"
          include_support = os.environ["INPUT_INCLUDE_SUPPORT"] == "true"

          summaries = {a["id"]: a for a in report.get("apps", [])}
          bumps = [t for t in report["tweaks"]
                   if t["outdated"]
                   and (not only or t["id"] in only)
                   and (include_payload or t["kind"] != "payload")]
          # A bumped tweak usually needs the shared headers/libraries it builds
          # against to move with it, so they travel with any tweak bump.
          if include_support and bumps:
              bumps += [s for s in report.get("support", []) if s["outdated"]]

          # One compile per app that has bumps, over that app's defaults plus the
          # tweaks that were bumped for it.
          verify = {}
          for tweak in bumps:
              if tweak["kind"] == "support":
                  continue
              for app in tweak.get("apps", []):
                  ids = set(summaries.get(app, {}).get("defaults", []))
                  ids.add(tweak["id"])
                  verify[app] = sorted(ids)

          (runner_temp / "plan.json").write_text(json.dumps(
              {"bumps": bumps, "verify": verify}, indent=2))

          lines = ["| app | tweak | kind | version | commit |", "| --- | --- | --- | --- | --- |"]
          for tweak in report["tweaks"] + report.get("support", []):
              version = (f"{tweak['local_version']} -> {tweak['upstream_version']}" if tweak["outdated"]
                         else tweak["local_version"] or "-")
              commit = (f"{tweak['local_commit']} -> {tweak['upstream_commit']}" if tweak["local_commit"]
                        else tweak["note"] or "-")
              app = ", ".join(tweak.get("apps", [])) or "-"
              lines.append(f"| {app} | {tweak['id']} | {tweak['kind']} | {version} | {commit} |")
          summary = "\n".join(lines)
          if report["offline"]:
              summary += "\n\nnetwork unreachable - upstream versions could not be checked"
          names = [t["id"] if t["kind"] != "support" else t["path"] for t in bumps]
          summary += f"\n\n{len(bumps)} to update: {' '.join(names) or '-'}\n"
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary)
          print(summary)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"changed={'true' if bumps else 'false'}\n")
              out.write(f"count={len(bumps)}\n")
          PY

      - name: Apply the update
        id: apply
        if: ${{ steps.plan.outputs.changed == 'true' }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          repo = Path("repo")
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          plan = json.loads((runner_temp / "plan.json").read_text())

          def git(*args):
              proc = subprocess.run(["git", *args], cwd=repo, capture_output=True, text=True)
              if proc.returncode != 0:
                  raise SystemExit(f"error: git {' '.join(args)} failed:\n{proc.stderr.strip()}")
              return proc.stdout

          submodules = [t["path"] for t in plan["bumps"] if t["kind"] in ("submodule", "support")]
          if submodules:
              git("submodule", "update", "--init", "--remote", "--", *submodules)
              print(f"moved to the upstream head: {' '.join(submodules)}")

          for tweak in plan["bumps"]:
              if tweak["kind"] != "payload":
                  continue
              variable = tweak["version_var"]
              # Payload versions live in the app that ships the payload.
              manifest = repo / "apps" / tweak["apps"][0] / "payloads.mk"
              # newline="" keeps the file's line endings, so the bump stays a one-line diff.
              with manifest.open("r", newline="") as handle:
                  text = handle.read()
              text, count = re.subn(rf"(?m)^({re.escape(variable)}\s*=\s*)\S+",
                                    lambda match: match.group(1) + tweak["upstream_version"],
                                    text)
              if count != 1:
                  raise SystemExit(f"error: expected exactly one {variable} in {manifest}, found {count}")
              with manifest.open("w", newline="") as handle:
                  handle.write(text)
              print(f"bumped {variable} to {tweak['upstream_version']}")

          diff = git("--no-pager", "diff", "--submodule=short")
          print(diff or "(nothing changed)")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as handle:
              handle.write(f"\n```diff\n{diff}\n```\n")

          message = ["chore(tweaks): update outdated tweaks", ""]
          for tweak in plan["bumps"]:
              if tweak["kind"] == "support":
                  message.append(f"{tweak['path']} {tweak['local_commit']} -> {tweak['upstream_commit']}")
              elif tweak["kind"] == "submodule":
                  message.append(f"{tweak['id']} {tweak['local_version']} -> {tweak['upstream_version']}"
                                 f" ({tweak['local_commit']} -> {tweak['upstream_commit']})")
              else:
                  message.append(f"{tweak['id']} {tweak['local_version']} -> {tweak['upstream_version']}")
          (runner_temp / "commit-message.txt").write_text("\n".join(message) + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("applied=true\n")
          with open(runner_temp / "verify.json", "w") as handle:
              json.dump(plan["verify"], handle)
          PY

      - name: Install Dependencies
        if: ${{ inputs.verify }}
        run: brew install ldid dpkg make curl

      - name: Set PATH
        if: ${{ inputs.verify }}
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        if: ${{ inputs.verify }}
        uses: actions/checkout@v7
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      # The SDKs the app's own-SDK tweaks need are cached together with the
      # pipeline's, so the cache key has to name them (and a look at the app's
      # registry has to happen before the cache step).
      - name: Determine the SDKs the app's tweaks ask for
        working-directory: repo
        run: |
          list="$(Tools/install-own-sdk.sh --list '${{ inputs.app_id }}' | tr '\n' '-')"
          [ -z "$list" ] || list="-$list"
          printf 'suffix=%s\n' "$list" >> "$GITHUB_OUTPUT"
        id: extra_sdks

      - name: Install the SDKs the app's tweaks ask for
        working-directory: repo
        env:
          THEOS: ${{ github.workspace }}/theos
        run: Tools/install-own-sdk.sh "${{ inputs.app_id }}"

      - name: SDK Caching
        if: ${{ inputs.verify }}
        id: SDK
        uses: actions/cache@v6
        with:
          path: theos/sdks/
          # Same source and key as the build workflow, so the SDK download is shared.
          key: iOS-xybp888-${{ inputs.sdk_version }}${{ steps.extra_sdks.outputs.suffix }}-SDK

      - name: Download iOS SDK
        if: ${{ inputs.verify && steps.SDK.outputs.cache-hit != 'true' }}
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs.git sdks
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS${{ inputs.sdk_version }}.sdk
          git checkout --quiet
          if [ ! -d "iPhoneOS${{ inputs.sdk_version }}.sdk" ]; then
            echo "error: iPhoneOS${{ inputs.sdk_version }}.sdk does not exist in xybp888/iOS-SDKs" >&2
            exit 1
          fi
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      # The gate: a bump that does not compile never reaches the branch. Every
      # app whose tweaks were bumped is compiled with its own default set plus
      # the bumped tweaks, so the app sets cannot hide a break in one another.
      - name: Compile the bumped tweaks
        if: ${{ inputs.verify && steps.apply.outputs.applied == 'true' }}
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail
          cd repo
          python3 - "$RUNNER_TEMP/verify.json" <<'PY' > "$RUNNER_TEMP/verify.tsv"
          import json, sys
          for app, ids in json.load(open(sys.argv[1])).items():
              print(f"{app}\t{' '.join(ids)}")
          PY
          while IFS=$'\t' read -r app ids; do
            [ -n "$app" ] || continue
            echo "compiling $app: $ids"
            make all THEOS_PACKAGE_SCHEME=rootless \
              APP="$app" \
              SDK_VERSION="${{ inputs.sdk_version }}" \
              ENABLED_TWEAKS="$ids"
          done < "$RUNNER_TEMP/verify.tsv"

      - name: Commit and push
        if: ${{ inputs.push && steps.apply.outputs.applied == 'true' }}
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -u stages exactly the gitlinks and the payloads.mk files the step above touched.
          git add -u
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          # The branch can move while the verification compiles: rebase onto the
          # current tip so a commit that landed meanwhile cannot reject the update.
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "pushed $(git rev-parse --short HEAD) to ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
